<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SpeedCam Alert</title>
<meta name="theme-color" content="#0f1720">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Barlow:wght@400;600&display=swap">
<style>
  /* Dashboard layout: full-screen map, instrument panel docked at the bottom like a car cluster */
  :root{
    --bg:#0f1720; --panel:#16212c; --line:#2a3846; --fg:#e8eef3; --muted:#8fa1b2;
    --safe:#3ecf8e; --warn:#ffb020; --danger:#ff4d4f; --accent:#4aa3ff;
    --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--body)}
  body{display:flex;flex-direction:column}
  #map{flex:1;min-height:200px;background:#1b2632}
  .panel{background:var(--panel);border-top:1px solid var(--line);
    padding:12px max(16px,env(safe-area-inset-left)) calc(12px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-right));
    display:grid;gap:10px}
  .cluster{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:10px;align-items:stretch}
  .gauge{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:center;min-width:0}
  .gauge small{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .gauge b{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.05;font-variant-numeric:tabular-nums}
  .gauge span{font-size:12px;color:var(--muted)}
  #camGauge{transition:background .2s,border-color .2s}
  #camGauge.near{border-color:var(--warn)}
  #camGauge.near b{color:var(--warn)}
  #camGauge.close{background:var(--danger);border-color:var(--danger)}
  #camGauge.close b,#camGauge.close small,#camGauge.close span{color:#fff}
  .limit{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;
    border:5px solid var(--danger);background:#fff;color:#111;font-family:var(--display);font-weight:700;font-size:20px;margin-top:2px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  button{font:600 15px var(--body);border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);padding:10px 14px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#04121f;flex:1}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  #status{font-size:13px;color:var(--muted);min-height:1.2em}
  #banner{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);
    background:var(--danger);color:#fff;font-family:var(--display);font-size:26px;font-weight:700;
    padding:10px 20px;border-radius:10px;box-shadow:0 6px 24px rgba(0,0,0,.4);z-index:2000;text-align:center;width:max-content;max-width:calc(100% - 32px);cursor:pointer}
  dialog{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:12px;max-width:440px;width:calc(100% - 32px)}
  dialog label{display:block;font-size:13px;color:var(--muted);margin:12px 0 4px}
  dialog input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font:15px var(--body)}
  dialog p{font-size:13px;color:var(--muted);line-height:1.45}
  [hidden]{display:none!important}
  @media (max-width:380px){.gauge b{font-size:28px}}
</style>
</head>
<body>
<div id="map"></div>
<div id="banner" hidden>📷 Speed camera ahead</div>

<div class="panel">
  <div class="cluster">
    <div class="gauge"><small>Speed</small><b id="spd">–</b><span>km/h</span></div>
    <div class="gauge" id="camGauge"><small>Next camera ahead</small><b id="camDist">–</b><span id="camInfo">none within range</span></div>
    <div class="gauge"><small>Limit</small><div id="limitWrap"><b id="limit" style="font-size:22px">–</b></div></div>
  </div>
  <div class="row">
    <button class="primary" id="startBtn">Start driving</button>
    <button id="addBtn" title="Mark a camera at your current position">+ Camera here</button>
    <button id="testBtn">Test alert</button>
    <button id="setBtn" aria-label="Settings">⚙</button>
  </div>
  <div id="status">Tap “Start driving”. Allow location access when asked.</div>
</div>

<dialog id="settings">
  <h3 style="margin:0 0 4px">Settings</h3>
  <label for="keyIn">Google Maps API key (optional)</label>
  <input id="keyIn" placeholder="AIza…" autocomplete="off">
  <p>With a key the map is Google Maps. Without one it uses OpenStreetMap. Camera data comes from OpenStreetMap either way, plus any cameras you mark yourself.</p>
  <label for="rangeIn">Warn me at (metres)</label>
  <input id="rangeIn" type="number" min="200" max="3000" step="100" value="1000">
  <label for="voiceIn"><input id="voiceIn" type="checkbox" checked style="width:auto"> Voice announcement</label>
  <div class="row" style="margin-top:14px">
    <button id="copyMine">Copy my cameras</button>
    <button id="clearMine">Delete my cameras</button>
    <button class="primary" id="saveSet">Save</button>
  </div>
  <textarea id="exportOut" hidden rows="6" readonly style="width:100%;margin-top:10px;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;font:12px monospace"></textarea>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(() => {
  // ---------- storage helpers ----------
  const store = {
    get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }catch{ return d; } },
    set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch{} }
  };
  const cfg = Object.assign({ key:"", range:1000, voice:true }, store.get("sca_cfg", {}));
  let myCams = store.get("sca_mycams", []);   // [{lat,lon,id,maxspeed}]

  // ---------- geo math ----------
  const toRad = d => d*Math.PI/180, toDeg = r => r*180/Math.PI;
  function dist(a1,o1,a2,o2){
    const R=6371000, dA=toRad(a2-a1), dO=toRad(o2-o1);
    const h=Math.sin(dA/2)**2+Math.cos(toRad(a1))*Math.cos(toRad(a2))*Math.sin(dO/2)**2;
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function bearing(a1,o1,a2,o2){
    const y=Math.sin(toRad(o2-o1))*Math.cos(toRad(a2));
    const x=Math.cos(toRad(a1))*Math.sin(toRad(a2))-Math.sin(toRad(a1))*Math.cos(toRad(a2))*Math.cos(toRad(o2-o1));
    return (toDeg(Math.atan2(y,x))+360)%360;
  }
  const angDiff = (a,b) => { const d=Math.abs(a-b)%360; return d>180?360-d:d; };

  // ---------- UI refs ----------
  const $ = id => document.getElementById(id);
  const statusEl=$("status"), banner=$("banner");
  const setStatus = t => statusEl.textContent = t;

  // ---------- map layer (Google if key, else Leaflet/OSM) ----------
  const MapView = {
    kind:null, map:null, me:null, camMarkers:[],
    async init(lat,lon){
      if(cfg.key){
        try{ await loadGoogle(cfg.key); this.kind="google"; }
        catch{ setStatus("Google Maps failed to load (check your key). Using OpenStreetMap."); }
      }
      if(this.kind==="google"){
        this.map=new google.maps.Map($("map"),{center:{lat,lng:lon},zoom:16,disableDefaultUI:true,zoomControl:true,
          styles:[{elementType:"geometry",stylers:[{color:"#1d2833"}]},{elementType:"labels.text.fill",stylers:[{color:"#9fb3c4"}]},
                  {featureType:"road",elementType:"geometry",stylers:[{color:"#34495c"}]},{featureType:"water",stylers:[{color:"#0c1a26"}]}]});
        this.me=new google.maps.Marker({map:this.map,position:{lat,lng:lon},zIndex:999,
          icon:{path:google.maps.SymbolPath.FORWARD_CLOSED_ARROW,scale:6,fillColor:"#4aa3ff",fillOpacity:1,strokeColor:"#fff",strokeWeight:2,rotation:0}});
      }else{
        this.kind="leaflet";
        this.map=L.map("map",{zoomControl:true,attributionControl:true}).setView([lat,lon],16);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(this.map);
        this.me=L.marker([lat,lon],{icon:arrowIcon(0),zIndexOffset:1000}).addTo(this.map);
      }
    },
    update(lat,lon,hdg){
      if(!this.map) return;
      if(this.kind==="google"){
        this.me.setPosition({lat,lng:lon});
        const ic=this.me.getIcon(); ic.rotation=hdg||0; this.me.setIcon(ic);
        this.map.panTo({lat,lng:lon});
      }else{
        this.me.setLatLng([lat,lon]); this.me.setIcon(arrowIcon(hdg||0));
        this.map.panTo([lat,lon],{animate:true});
      }
    },
    drawCams(list){
      this.camMarkers.forEach(m=> this.kind==="google"? m.setMap(null) : m.remove());
      this.camMarkers=list.map(c=>{
        const label = (c.mine?"Your camera":c.preset?(c.name||"Saved camera"):"Speed camera")+(c.maxspeed?` · ${c.maxspeed} km/h`:"");
        const svg = dangerSvg(c.mine?"#ff9800":"#e53935");
        if(this.kind==="google"){
          return new google.maps.Marker({map:this.map,position:{lat:c.lat,lng:c.lon},title:label,zIndex:500,
            icon:{url:"data:image/svg+xml;charset=UTF-8,"+encodeURIComponent(svg),
                  scaledSize:new google.maps.Size(34,34),anchor:new google.maps.Point(17,30)}});
        }
        return L.marker([c.lat,c.lon],{zIndexOffset:500,icon:L.divIcon({className:"",html:svg,iconSize:[34,34],iconAnchor:[17,30],popupAnchor:[0,-26]})})
          .bindPopup(label).addTo(this.map);
      });
    }
  };
  // Warning-triangle "danger" sign used for every camera
  function dangerSvg(fill){
    return `<svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 34 34">
      <path d="M17 2.5 L32.5 30 H1.5 Z" fill="${fill}" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round"/>
      <rect x="15.2" y="11" width="3.6" height="10.5" rx="1.6" fill="#ffffff"/>
      <circle cx="17" cy="25.4" r="2.1" fill="#ffffff"/></svg>`;
  }
  function arrowIcon(deg){
    return L.divIcon({className:"",iconSize:[30,30],iconAnchor:[15,15],
      html:`<svg width="30" height="30" viewBox="0 0 30 30" style="transform:rotate(${deg}deg)"><path d="M15 2 L26 27 L15 21 L4 27 Z" fill="#4aa3ff" stroke="#fff" stroke-width="2"/></svg>`});
  }
  function loadGoogle(key){
    return new Promise((res,rej)=>{
      window.__gmReady=res;
      const s=document.createElement("script");
      s.src=`https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(key)}&callback=__gmReady`;
      s.onerror=rej; document.head.appendChild(s);
      setTimeout(()=>rej(new Error("timeout")),12000);
    });
  }

  // ---------- camera data (OpenStreetMap Overpass) ----------
  let osmCams=[], lastFetch=null, fetching=false;
  async function fetchCams(lat,lon){
    if(fetching) return; fetching=true;
    const q=`[out:json][timeout:25];(node["highway"="speed_camera"](around:20000,${lat},${lon});node["enforcement"="maxspeed"](around:20000,${lat},${lon}););out body;`;
    const servers=["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"];
    for(const url of servers){
      try{
        const r=await fetch(url,{method:"POST",body:"data="+encodeURIComponent(q),headers:{"Content-Type":"application/x-www-form-urlencoded"}});
        if(!r.ok) throw 0;
        const j=await r.json();
        osmCams=j.elements.map(e=>({id:"osm"+e.id,lat:e.lat,lon:e.lon,
          maxspeed:parseInt((e.tags&&e.tags.maxspeed)||"",10)||null,
          dir: e.tags&&e.tags.direction&&!isNaN(+e.tags.direction)? +e.tags.direction : null}));
        lastFetch={lat,lon};
        setStatus(`${presetCams.length} saved · ${osmCams.length} from OpenStreetMap within 20 km · ${myCams.length} marked by you`);
        MapView.drawCams(allCams());
        fetching=false; return;
      }catch{}
    }
    fetching=false;
    setStatus("Couldn't download camera data (no internet?). Using your own marked cameras.");
  }
  // ---------- hardcoded cameras ----------
  // Add cameras here directly, OR (easier) edit cameras.json in the same folder.
  // Format: { lat: 31.7080, lon: 76.9320, maxspeed: 50, dir: 90, name: "Mandi bypass" }
  //   maxspeed, dir (compass degrees the camera faces) and name are optional.
  const PRESET_CAMS = [
  ];
  let presetCams = [];
  function normPreset(list, src){
    return (Array.isArray(list)?list:[]).filter(c=>isFinite(+c.lat)&&isFinite(+c.lon)).map((c,i)=>({
      id:`${src}${i}_${c.lat}_${c.lon}`, lat:+c.lat, lon:+c.lon,
      maxspeed: parseInt(c.maxspeed,10)||null,
      dir: c.dir!=null && isFinite(+c.dir) ? +c.dir : null,
      name: c.name||"", preset:true }));
  }
  async function loadPresets(){
    presetCams = normPreset(PRESET_CAMS,"pc");
    try{
      const r = await fetch("cameras.json?v="+Date.now(), {cache:"no-store"});
      if(r.ok){ presetCams = presetCams.concat(normPreset(await r.json(),"pj")); store.set("sca_presetcache", presetCams); }
      else throw 0;
    }catch{
      // offline: use the copy saved last time
      const cached = store.get("sca_presetcache", null);
      if(cached && cached.length > presetCams.length) presetCams = cached;
    }
    if(MapView.map) MapView.drawCams(allCams());
  }
  loadPresets();

  const allCams = () => presetCams.concat(osmCams, myCams.map(c=>({...c,mine:true})));

  // ---------- alerts ----------
  let audioCtx=null;
  function beep(times=2){
    if(!audioCtx) return;
    for(let i=0;i<times;i++){
      const o=audioCtx.createOscillator(), g=audioCtx.createGain(), t=audioCtx.currentTime+i*0.28;
      o.type="square"; o.frequency.value=1150; g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(0.35,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g).connect(audioCtx.destination); o.start(t); o.stop(t+0.22);
    }
  }
  function say(text){
    if(!cfg.voice||!("speechSynthesis" in window)) return;
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.rate=1.05; speechSynthesis.speak(u);
  }
  // ---------- continuous alarm ----------
  // active = the camera currently being warned about. It keeps alarming until you pass it
  // (it ends up behind you) or you leave the warning radius.
  let active=null, mutedId=null;
  const passed=new Set();                 // cameras already crossed; re-armed once you're far away
  const fmt = d => d>=1000 ? (d/1000).toFixed(1)+" km" : Math.round(d/10)*10+" m";
  function showBanner(){
    if(!active){ banner.hidden=true; return; }
    const {c,d}=active;
    banner.textContent=`⚠️ Camera in ${fmt(d)}${c.maxspeed?` · limit ${c.maxspeed}`:""}${mutedId===c.id?" · muted":" · tap to mute"}`;
    banner.style.background = d<300 ? "var(--danger)" : "#d97706";
    banner.hidden=false;
  }
  function alarmTick(){
    if(!active || mutedId===active.c.id) return;
    const now=Date.now(), {c,d}=active;
    const gap = d<300 ? 2000 : d<500 ? 4000 : 6000;      // beeps get faster as you get closer
    if(now-active.lastBeep>=gap){
      active.lastBeep=now; beep(d<300?3:2);
      if(navigator.vibrate) navigator.vibrate(d<300?[250,100,250,100,250]:[300,150,300]);
    }
    if(now-active.lastVoice>=12000){
      active.lastVoice=now;
      const where = c.name ? `, ${c.name}` : "";
      say(`${d<300?"Speed camera close":"Speed camera ahead"}, ${Math.round(d/50)*50} metres${where}${c.maxspeed?`. Limit ${c.maxspeed}`:""}`);
    }
  }
  setInterval(alarmTick,500);
  banner.onclick=()=>{ if(active){ mutedId=active.c.id; window.speechSynthesis?.cancel(); showBanner(); } };
  function setActive(c,d){
    if(!active || active.c.id!==c.id) active={c,d,lastBeep:0,lastVoice:0};
    else active.d=d;
    showBanner(); alarmTick();
  }
  function clearActive(reason){
    if(!active) return;
    const wasMuted = mutedId===active.c.id;
    passed.add(active.c.id); active=null; mutedId=null; showBanner();
    if(!wasMuted && reason==="passed") say("Camera passed");
  }
  // test button helper
  function alertCam(d,c){ setActive({...c,id:"test"},d); setTimeout(()=>{ if(active&&active.c.id==="test"){ active=null; showBanner(); } },8000); }

  // ---------- tracking ----------
  let prev=null, heading=null, cur=null, watchId=null, wakeLock=null;
  function onPos(p){
    const {latitude:lat, longitude:lon, speed, heading:gh, accuracy}=p.coords;
    if(!MapView.map){ MapView.init(lat,lon).then(()=>{ MapView.drawCams(allCams()); }); }
    // heading: GPS heading when moving, otherwise derived from movement
    if(gh!=null && !isNaN(gh) && speed>1.5) heading=gh;
    else if(prev && dist(prev.lat,prev.lon,lat,lon)>12) heading=bearing(prev.lat,prev.lon,lat,lon);
    if(!prev || dist(prev.lat,prev.lon,lat,lon)>12) prev={lat,lon};
    cur={lat,lon};
    let kmh = speed!=null && !isNaN(speed) ? speed*3.6 : null;
    $("spd").textContent = kmh==null ? "–" : Math.round(kmh);
    MapView.update(lat,lon,heading);
    if(!lastFetch || dist(lastFetch.lat,lastFetch.lon,lat,lon)>8000) fetchCams(lat,lon);
    check(lat,lon,kmh,accuracy);
  }
  function check(lat,lon,kmh,acc){
    const range=cfg.range;
    let best=null;
    for(const c of allCams()){
      const d=dist(lat,lon,c.lat,c.lon);
      if(d>range*1.6){ passed.delete(c.id); continue; }
      if(passed.has(c.id) || d>range) continue;
      // "ahead": within ±50° of travel direction (or very close). No heading yet → count everything nearby.
      const ahead = heading==null || d<60 || angDiff(heading,bearing(lat,lon,c.lat,c.lon))<=50;
      // if camera has a facing direction, skip ones pointed at the opposite carriageway
      const facing = c.dir==null || heading==null || angDiff(c.dir,heading)<=90 || angDiff(c.dir,(heading+180)%360)<=90;
      if(ahead && facing && (!best || d<best.d)) best={c,d};
    }
    // keep the camera already alarming, with extra tolerance for hill bends
    if(active && active.c.id!=="test"){
      const c=allCams().find(x=>x.id===active.c.id);
      if(c){
        const d=dist(lat,lon,c.lat,c.lon);
        const ang = heading==null ? 0 : angDiff(heading,bearing(lat,lon,c.lat,c.lon));
        if(d>range*1.05) clearActive("left");
        else if(d>=40 && ang>100) clearActive("passed");     // camera is now behind you
        else if(!best || best.c.id===c.id || best.d>d) best={c,d};
      } else clearActive("left");
    }
    const g=$("camGauge");
    if(!best){
      $("camDist").textContent="–"; $("camInfo").textContent=`none within ${range>=1000?range/1000+" km":range+" m"}`;
      g.className="gauge"; setLimit(null); return;
    }
    const {c,d}=best;
    $("camDist").textContent = fmt(d);
    $("camInfo").textContent = c.mine ? "marked by you" : c.preset ? (c.name || "saved list") : "OpenStreetMap";
    setLimit(c.maxspeed, kmh);
    g.className = "gauge " + (d<300 ? "close" : "near");
    setActive(c,d);
  }
  function setLimit(v){
    $("limitWrap").innerHTML = v ? `<span class="limit">${v}</span>` : `<b id="limit" style="font-size:22px">–</b>`;
  }

  async function start(){
    if(!("geolocation" in navigator)){ setStatus("This browser has no GPS access."); return; }
    try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume(); }catch{}
    if("speechSynthesis" in window){ const u=new SpeechSynthesisUtterance(""); speechSynthesis.speak(u); }
    try{ wakeLock = await navigator.wakeLock?.request("screen"); }catch{}
    setStatus("Finding your location…");
    watchId=navigator.geolocation.watchPosition(onPos, e=>{
      setStatus(e.code===1 ? "Location permission denied. Enable it in browser settings and reload."
        : "Waiting for GPS signal…");
    },{enableHighAccuracy:true,maximumAge:1000,timeout:20000});
    $("startBtn").textContent="Stop"; $("startBtn").onclick=stop;
  }
  function stop(){
    if(watchId!=null) navigator.geolocation.clearWatch(watchId);
    watchId=null; try{wakeLock&&wakeLock.release();}catch{}
    $("startBtn").textContent="Start driving"; $("startBtn").onclick=start;
    setStatus("Stopped.");
  }
  document.addEventListener("visibilitychange",async()=>{
    if(document.visibilityState==="visible" && watchId!=null){ try{ wakeLock=await navigator.wakeLock?.request("screen"); }catch{} }
  });

  // ---------- buttons ----------
  $("startBtn").onclick=start;
  $("testBtn").onclick=async()=>{
    try{ audioCtx=audioCtx||new (window.AudioContext||window.webkitAudioContext)(); await audioCtx.resume(); }catch{}
    alertCam(cfg.range*0.8,{maxspeed:60,name:"test"});
  };
  $("addBtn").onclick=()=>{
    if(!cur){ setStatus("Start driving first so I know where you are."); return; }
    myCams.push({id:"me"+Date.now(),lat:cur.lat,lon:cur.lon,maxspeed:null});
    store.set("sca_mycams",myCams); MapView.drawCams(allCams());
    setStatus(`Camera saved at your position. You have ${myCams.length} marked.`);
  };
  const dlg=$("settings");
  $("setBtn").onclick=()=>{ $("keyIn").value=cfg.key; $("rangeIn").value=cfg.range; $("voiceIn").checked=cfg.voice; dlg.showModal(); };
  $("saveSet").onclick=()=>{
    const keyChanged = $("keyIn").value.trim()!==cfg.key;
    cfg.key=$("keyIn").value.trim(); cfg.range=Math.max(200,Math.min(3000,+$("rangeIn").value||1000)); cfg.voice=$("voiceIn").checked;
    store.set("sca_cfg",cfg); dlg.close();
    if(keyChanged) location.reload();
  };
  $("copyMine").onclick=async()=>{
    const json = JSON.stringify(myCams.map(c=>({lat:+c.lat.toFixed(6),lon:+c.lon.toFixed(6),maxspeed:c.maxspeed||null,name:""})),null,2);
    try{ await navigator.clipboard.writeText(json); $("copyMine").textContent="Copied ✓"; }
    catch{ const t=$("exportOut"); t.value=json; t.hidden=false; t.select(); $("copyMine").textContent="Select & copy below"; }
    setTimeout(()=>$("copyMine").textContent="Copy my cameras",2000);
  };
  $("clearMine").onclick=()=>{ myCams=[]; store.set("sca_mycams",myCams); MapView.drawCams(allCams()); setStatus("Your marked cameras were deleted."); };
})();
</script>
</body>
</html>
